<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مساعد fawakihAI الذكي</title>
<!-- مكتبات تحويل النصوص إلى Markdown وتلوين الأكواد -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
  }

  body {
    background: linear-gradient(135deg, #09090b, #18181b, #09090b);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    color: #e2e8f0;
  }

  .chat-container {
    width: 100%;
    max-width: 950px;
    height: 95vh;
    background: rgba(24, 24, 27, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .chat-header {
    padding: 18px 24px;
    background: rgba(9, 9, 11, 0.8);
    display: flex;
    align-items: center;
    gap: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .chat-header .avatar {
    width: 45px; 
    height: 45px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-size: 20px; 
    color: #fff;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
  }

  .chat-header h1 { font-size: 18px; font-weight: 600; color: #f8fafc; }
  .chat-header p { font-size: 12px; color: #94a3b8; margin-top: 2px;}

  .header-actions {
    margin-right: auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-icon {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #cbd5e1;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-icon:hover { 
    background: rgba(255, 255, 255, 0.1); 
    color: #fff;
    transform: translateY(-2px);
  }

  .model-badge {
    padding: 6px 14px;
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.3);
    color: #93c5fd;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    direction: ltr;
  }

  .chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  .chat-box::-webkit-scrollbar { width: 6px; }
  .chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

  .message {
    max-width: 85%;
    padding: 16px 20px;
    border-radius: 20px;
    line-height: 1.7;
    font-size: 15px;
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .user {
    align-self: flex-start;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 5px 15px rgba(37, 99, 235, 0.2);
  }

  .bot {
    align-self: flex-end;
    background: rgba(39, 39, 42, 0.6);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-bottom-left-radius: 4px;
  }

  /* تنسيق النصوص البرمجية ومربعات الأكواد */
  .bot p { margin-bottom: 10px; }
  .bot p:last-child { margin-bottom: 0; }
  
  .code-wrapper {
    margin: 15px 0;
    background: #1e1e1e;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #333;
    direction: ltr;
    text-align: left;
  }

  .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2d2d2d;
    padding: 8px 15px;
    font-size: 12px;
    color: #aaa;
    border-bottom: 1px solid #3f3f3f;
  }

  .copy-btn {
    background: transparent;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: 0.2s;
  }

  .copy-btn:hover { color: #fff; }
  .copy-btn.copied { color: #4ade80; }

  pre { margin: 0; padding: 15px; overflow-x: auto; font-size: 14px;}
  code { font-family: 'Consolas', 'Monaco', monospace; }

  /* تنسيق رسالة الخطأ لتكون أنيقة */
  .system-msg {
    align-self: center;
    background: rgba(220, 38, 38, 0.1);
    border: 1px solid rgba(220, 38, 38, 0.3);
    color: #fca5a5;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* تأثير الكتابة (Typing) */
  .typing-indicator {
    align-self: flex-end;
    background: rgba(39, 39, 42, 0.6);
    padding: 16px 20px;
    border-radius: 20px;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .typing-indicator span {
    width: 8px; height: 8px;
    background: #8b5cf6;
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out;
  }

  .typing-indicator span:nth-child(1) { animation-delay: 0s; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* منطقة الإدخال */
  .input-area {
    padding: 20px;
    background: rgba(9, 9, 11, 0.8);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .input-area input {
    flex: 1;
    padding: 16px 24px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(24, 24, 27, 0.8);
    color: #f8fafc;
    font-size: 15px;
    outline: none;
    transition: all 0.3s;
  }

  .input-area input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    background: rgba(39, 39, 42, 0.9);
  }

  .input-area button {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }

  .input-area button:hover:not(:disabled) {
    transform: scale(1.08) rotate(-10deg);
  }

  .input-area button:disabled {
    background: #3f3f46;
    color: #71717a;
    box-shadow: none;
    cursor: not-allowed;
    transform: scale(1);
  }

  @media (max-width: 600px) {
    .chat-container { height: 100vh; border-radius: 0; border: none; }
    .message { max-width: 92%; }
    .input-area input { padding: 14px 18px; }
  }
</style>

</div>

<script>
  // ==============================================
  // 🔑 الإعدادات — API
  // ==============================================
  const GROQ_KEY = "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";
  const GROQ_LIST_URL = "https://api.groq.com/openai/v1/models";
  const GROQ_CHAT_URL = "https://api.groq.com/openai/v1/chat/completions";

  // ==============================================
  // 🧠 معرفة تطبيق fawakihAI (System Prompt)
  // ==============================================
  const FAWAKIH_SYSTEM_PROMPT = `
أنت المساعد الذكي الرسمي لتطبيق "فواكه AI" (FawakihAI). تم صنعك وبرمجتك بواسطة مطوري تطبيق fawakihAI لتكون مساعدهم النموذجي. أنت خبير في كل ما يتعلق بالتطبيق، وتجيب فقط بناءً على المعلومات التالية. إذا سُئلت "من طورك" أو "من برمجك" أو "من صنعك"، أجب بوضوح: "صنعوني مطورين تطبيق fawakihAI كمساعد نموذج لهم."

--- معلومات تطبيق fawakihAI ---

**الاسم:** فواكه AI (FawakihAI)
**المطور:** Hamza Elhumada (حسب الموقع الرسمي)
**الوظيفة الرئيسية:** تطبيق احترافي متخصص في تحليل وتوقعات نتائج لعبة تخمين الفواكه عبر خوارزميات الذكاء الاصطناعي المباشرة. يعمل داخل غرف الدردشة الصوتية على منصة يلا لايف (Yalla Live).
**محرك الذكاء الاصطناعي:** Gemini AI من Google.
**دقة الخوارزمية:** 86.7% (حسب الموقع الرسمي).
**حجم التطبيق:** 33 MB.
**عدد التثبيتات:** +86 ألف.
**التقييم:** 4.6 من 5.

**التطبيقات المدعومة للتخمين:**
1. يلا لايف (Yalla Live) — الأداة الأولى المدعومة.
2. ماسا (Masa) — برنامج تخمين حصري.
3. يويي (Yooy) — منظومة تخمين متكاملة.

**السعر:** اشتراك مدفوع بقيمة 35 دولار أمريكي.
**بوابات الدفع:** PayPal، والعملات الرقمية المشفرة (Cryptocurrencies).
**طريقة التحميل:** مباشرة من الموقع الرسمي (yasmenjasm2-sketch.github.io/fawakihAI2) دون الحاجة لمتجر تطبيقات.

**الميزات الرئيسية:**
- ذكاء اصطناعي Gemini AI يحلل الأنماط ويقدم تخمينات دقيقة.
- استجابة فورية في الوقت الفعلي داخل غرف يلا لايف.
- دقة عالية في التخمين تزيد مع كل جلسة.
- واجهة سهلة الاستخدام للمبتدئين.
- دعم فني متكامل 24/7 (عربي وإنجليزي).
- تحديثات مستمرة.
- تكامل مباشر مع يلا لايف (التطبيق مستقل ولا يحتاج API رسمي من يلا لايف).

**الخصوصية والسياسات:**
- جميع حقوق الملكية الفكرية محفوظة للمطور.
- يُحظر نسخ أو توزيع أو إعادة بيع التطبيق.
- لا يتم جمع بيانات شخصية غير ضرورية.
- بيانات الدفع مشفرة بالكامل.
- لا تتم مشاركة البيانات مع أطراف ثالثة.
- الاشتراك قابل للاسترداد في حالات الأعطال التقنية (يُرجى التواصل مع الدعم خلال 48 ساعة).

**روابط رسمية:**
- الموقع الرسمي: https://yasmenjasm2-sketch.github.io/fawakihAI2/
- الموقع التفصيلي: https://yasmenjasm2-sketch.github.io/totoman/
- نقطة نهاية API: api.fawakihai.com/v1
- التوثيق: docs.fawakihai.com

**ملاحظة هامة:** أنت مساعد مخصص فقط لتطبيق fawakihAI. لا تقدم معلومات عامة خارج نطاق التطبيق. إذا سُئلت عن أي شيء آخر، اعتذر بلطف ووضح أن تخصصك هو تطبيق fawakihAI فقط.
`;

  // إعدادات مكتبة التنسيق Markdown
  marked.setOptions({
    breaks: true,
    gfm: true
  });

  // ==============================================
  // الحالة (State)
  // ==============================================
  let availableModels = [];
  let currentModel = null;
  let conversationHistory = [];
  let isSending = false;
  let isReady = false;

  // ==============================================
  // عناصر الواجهة
  // ==============================================
  const chatBox = document.getElementById("chatBox");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const modelBadge = document.getElementById("modelBadge");
  const refreshBtn = document.getElementById("refreshBtn");

  // ==============================================
  // أدوات الواجهة
  // ==============================================
  
  // وظيفة النسخ للأكواد البرمجية
  window.copyCode = function(button) {
    const wrapper = button.closest('.code-wrapper');
    const code = wrapper.querySelector('code').innerText;
    
    navigator.clipboard.writeText(code).then(() => {
      const originalHTML = button.innerHTML;
      button.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
      button.classList.add('copied');
      setTimeout(() => {
        button.innerHTML = originalHTML;
        button.classList.remove('copied');
      }, 2000);
    });
  };

  // تحويل نصوص الذكاء الاصطناعي وتنسيق الأكواد
  function formatBotMessage(text) {
    // تحويل النص لـ HTML باستخدام Marked
    const rawHtml = marked.parse(text);
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = rawHtml;

    // البحث عن الأكواد ووضعها في صناديق احترافية
    const preElements = tempDiv.querySelectorAll('pre');
    preElements.forEach(pre => {
      const codeElement = pre.querySelector('code');
      const language = codeElement ? (codeElement.className.replace('language-', '') || 'كود') : 'كود';
      
      const wrapper = document.createElement('div');
      wrapper.className = 'code-wrapper';
      
      const header = document.createElement('div');
      header.className = 'code-header';
      header.innerHTML = `
        <span><i class="fas fa-code"></i> ${language.toUpperCase()}</span>
        <button class="copy-btn" onclick="copyCode(this)"><i class="fas fa-copy"></i> نسخ الكود</button>
      `;
      
      wrapper.appendChild(header);
      
      const clonedPre = pre.cloneNode(true);
      wrapper.appendChild(clonedPre);
      
      pre.parentNode.replaceChild(wrapper, pre);
      
      // تطبيق تلوين الأكواد
      if(codeElement) {
        hljs.highlightElement(wrapper.querySelector('code'));
      }
    });

    return tempDiv.innerHTML;
  }

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `message ${sender}`;
    
    if (sender === 'bot') {
      div.innerHTML = formatBotMessage(text);
    } else {
      div.textContent = text; // رسائل المستخدم تبقى نص عادي
    }
    
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showSystemMessage(text) {
    const div = document.createElement("div");
    div.className = "system-msg";
    div.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing-indicator";
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typingIndicator");
    if (el) el.remove();
  }

  // ==============================================
  // 🔍 الإعداد الصامت في الخلفية
  // ==============================================
  async function initializeAI() {
    isReady = false;
    sendBtn.disabled = true;
    userInput.disabled = true;
    userInput.placeholder = "جاري الاتصال بالخوادم...";

    try {
      const response = await fetch(GROQ_LIST_URL, {
        headers: { "Authorization": `Bearer ${GROQ_KEY}` }
      });

      if (response.ok) {
        const data = await response.json();
        availableModels = (data?.data || [])
          .filter(m => !m.id.includes("whisper") && !m.id.includes("tts") && !m.id.includes("guard"))
          .map(m => m.id)
          .sort((a, b) => {
            if (a.includes("llama-3.3-70b")) return -1;
            if (a.includes("qwen")) return -1;
            return 1;
          });
          
        if (availableModels.length > 0) {
          currentModel = availableModels[0];
          modelBadge.textContent = "متصل ✅";
          isReady = true;
          sendBtn.disabled = false;
          userInput.disabled = false;
          userInput.placeholder = "اكتب سؤالك عن تطبيق fawakihAI...";
          userInput.focus();
          
          // رسالة ترحيبية مخصصة لتطبيق fawakihAI
          if(chatBox.children.length === 0) {
              const welcome = document.createElement("div");
              welcome.className = "message bot";
              welcome.innerHTML = formatBotMessage(`
                **مرحباً بك في مساعد fawakihAI الذكي!** 🍎

                أنا المساعد الرسمي لتطبيق **فواكه AI** — الرفيق الأذكى لك في غرف الدردشة الصوتية على يلا لايف.

                يمكنني مساعدتك في:
                - التعرف على **ميزات التطبيق** وطريقة عمله.
                - شرح **آلية التخمين** المدعومة بـ Gemini AI.
                - توضيح **طرق الدفع** والاشتراك.
                - الإجابة عن **الأسئلة الشائعة** حول التطبيقات المدعومة (يلا لايف، ماسا، يويي).
                - تقديم **الدعم الفني** والمعلومات حول سياسات الخصوصية.

                كيف يمكنني مساعدتك اليوم؟
              `);
              chatBox.appendChild(welcome);
          }
          return;
        }
      }
      throw new Error("لم يتم العثور على نماذج");
    } catch (err) {
      console.error("خطأ في الاتصال:", err);
      modelBadge.textContent = "غير متصل ❌";
      userInput.placeholder = "تعذر الاتصال بالخادم.";
      showSystemMessage("عذراً، يوجد مشكلة في الاتصال بالذكاء الاصطناعي حالياً.");
    }
  }

  // ==============================================
  // 🚀 الاتصال الصامت ومعالجة الفشل
  // ==============================================
  async function callAI(contents) {
    // نضيف رسالة النظام (system prompt) في بداية كل طلب
    const systemMessage = {
      role: "system",
      content: FAWAKIH_SYSTEM_PROMPT
    };

    // تحويل سجل المحادثة إلى التنسيق المطلوب
    const messages = [
      systemMessage,
      ...contents.map(c => ({
        role: c.role === "model" ? "assistant" : "user",
        content: c.parts.map(p => p.text).join(" ")
      }))
    ];

    const attempts = [currentModel, ...availableModels.filter(m => m !== currentModel)];

    for (let model of attempts) {
      try {
        console.log(`جارٍ الطلب من: ${model}`); // في الخلفية فقط
        const response = await fetch(GROQ_CHAT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${GROQ_KEY}`
          },
          body: JSON.stringify({
            model: model,
            messages: messages,
            temperature: 0.7,
            max_tokens: 4000
          })
        });

        if (response.ok) {
          const data = await response.json();
          currentModel = model; // تحديث النموذج للناجح
          return data.choices[0].message.content;
        }
      } catch (err) {
        console.warn(`فشل النموذج ${model}:`, err.message);
        // ننتقل للنموذج التالي بصمت بدون إزعاج المستخدم
      }
    }
    throw new Error("فشلت جميع المحاولات");
  }

  // ==============================================
  // 📤 إرسال الرسالة
  // ==============================================
  async function sendMessage() {
    if (isSending || !isReady) return;
    const text = userInput.value.trim();
    if (!text) return;

    isSending = true;
    addMessage(text, "user");
    userInput.value = "";
    sendBtn.disabled = true;

    conversationHistory.push({
      role: "user",
      parts: [{ text: text }]
    });

    showTyping();

    try {
      const botText = await callAI(conversationHistory);
      hideTyping();
      addMessage(botText, "bot");
      conversationHistory.push({
        role: "model",
        parts: [{ text: botText }]
      });
    } catch (error) {
      hideTyping();
      showSystemMessage("عذراً، حدث خطأ مؤقت أثناء معالجة طلبك. يرجى المحاولة مرة أخرى.");
      conversationHistory.pop(); // إزالة رسالة المستخدم من الذاكرة ليعيد المحاولة
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  // ==============================================
  // الأحداث
  // ==============================================
  sendBtn.addEventListener("click", sendMessage);
  
  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  refreshBtn.addEventListener("click", () => {
    if (isSending) return;
    chatBox.innerHTML = "";
    conversationHistory = [];
    initializeAI();
  });

  // بدء التشغيل المخفي
  initializeAI();
</script>

</body>
</html>
